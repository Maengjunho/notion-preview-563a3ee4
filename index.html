<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #0b0a0f;
  --bg-card: #14131a;
  --surface: #111018;
  --text: #ede9e3;
  --text-dim: #8a8598;
  --accent: #d4a259;
  --accent-light: #e8c078;
  --accent-dark: #c48b3c;
  --grad: linear-gradient(135deg, #d4a259, #e8c078, #c48b3c);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: .35s cubic-bezier(.4,0,.2,1);
  --container: 1120px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; }
img { max-width: 100%; display: block; }
ul, ol { list-style: none; }

/* ===== Typography ===== */
.section-label {
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
}

h1 {
  font-size: clamp(2rem, 5.5vw, 3.6rem);
  font-weight: 900;
  letter-spacing: -.03em;
  line-height: 1.1;
}

h2 {
  font-size: clamp(1.5rem, 3.5vw, 2.3rem);
  font-weight: 800;
  letter-spacing: -.02em;
}

h3 { font-size: 1.2rem; font-weight: 700; }

/* ===== Layout ===== */
.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 24px;
}

section {
  padding: 100px 24px;
  max-width: var(--container);
  margin: 0 auto;
}

section.sec-dark {
  background: var(--surface);
  max-width: 100%;
  padding: 100px 0;
}

section.sec-dark > .container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  padding: .85rem 1.75rem;
  border-radius: 99px;
  font-size: 1rem;
  font-weight: 700;
  transition: var(--transition);
  cursor: pointer;
  border: none;
}

.btn-primary {
  background: var(--grad);
  color: #0b0a0f;
}

.btn-primary:hover { opacity: .88; transform: translateY(-2px); }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1.5px solid rgba(212,162,89,.35);
}

.btn-ghost:hover {
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-2px);
}

.btn-lg { padding: 1rem 2.25rem; font-size: 1.1rem; }

/* ===== Chips ===== */
.chip {
  display: inline-flex;
  align-items: center;
  padding: .35rem .9rem;
  border-radius: 99px;
  font-size: .8rem;
  font-weight: 600;
  background: rgba(212,162,89,.12);
  color: var(--accent);
  border: 1px solid rgba(212,162,89,.25);
  cursor: default;
}

.f-chip {
  padding: .4rem 1rem;
  border-radius: 99px;
  font-size: .82rem;
  font-weight: 600;
  background: transparent;
  color: var(--text-dim);
  border: 1.5px solid rgba(255,255,255,.1);
  cursor: pointer;
  transition: var(--transition);
}

.f-chip:hover, .f-chip.active {
  background: rgba(212,162,89,.15);
  color: var(--accent);
  border-color: rgba(212,162,89,.4);
}

/* ===== Animation ===== */
.anim {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity .6s var(--transition), transform .6s var(--transition);
}
.anim.visible { opacity: 1; transform: translateY(0); }

/* ===== Navigation ===== */
.nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  padding: 0 24px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  background: rgba(11,10,15,.75);
  border-bottom: 1px solid rgba(255,255,255,.06);
}

.nav-logo {
  font-size: 1.15rem;
  font-weight: 900;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
}

.nav-links a {
  font-size: .9rem;
  font-weight: 500;
  color: var(--text-dim);
  transition: color var(--transition);
  cursor: pointer;
}

.nav-links a:hover, .nav-links a.nav-active { color: var(--text); }

/* ===== Hero ===== */
.hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 100px 24px 80px;
  position: relative;
  overflow: hidden;
}

.hero-glow-top {
  position: absolute;
  top: -120px; left: 50%;
  transform: translateX(-50%);
  width: 600px; height: 400px;
  background: radial-gradient(ellipse, rgba(212,162,89,.22) 0%, transparent 70%);
  pointer-events: none;
}

.hero-glow-bottom {
  position: absolute;
  bottom: -80px; left: 50%;
  transform: translateX(-50%);
  width: 800px; height: 300px;
  background: radial-gradient(ellipse, rgba(212,162,89,.1) 0%, transparent 70%);
  pointer-events: none;
}

.hero-content { position: relative; z-index: 1; max-width: 820px; }

.hero-award {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  padding: .45rem 1.1rem;
  border-radius: 99px;
  background: rgba(212,162,89,.12);
  border: 1px solid rgba(212,162,89,.3);
  font-size: .82rem;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 1.75rem;
}

.hero h1 { margin-bottom: 1.5rem; }
.hero h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

.hero-sub {
  font-size: 1.15rem;
  color: var(--text-dim);
  margin-bottom: 2.5rem;
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
}

.hero-btns {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 3rem;
}

.hero-stats {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  flex-wrap: wrap;
}

.hero-stat strong {
  display: block;
  font-size: 1.8rem;
  font-weight: 900;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-stat span {
  font-size: .82rem;
  color: var(--text-dim);
  font-weight: 500;
}

.hero-scroll {
  position: absolute;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%);
  font-size: .8rem;
  color: var(--text-dim);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .3rem;
  animation: float 2.5s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-8px); }
}

/* ===== Trust Bar ===== */
.trust-bar {
  padding: 40px 24px;
  border-top: 1px solid rgba(255,255,255,.05);
  border-bottom: 1px solid rgba(255,255,255,.05);
  text-align: center;
}

.trust-label {
  font-size: .72rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 1.25rem;
}

.trust-list {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2.5rem;
  flex-wrap: wrap;
}

.trust-item {
  font-size: .85rem;
  font-weight: 600;
  color: var(--text-dim);
  opacity: .5;
  transition: opacity var(--transition);
  cursor: default;
}

.trust-item:hover { opacity: .85; }

/* ===== Section Header ===== */
.sec-header { text-align: center; margin-bottom: 3.5rem; }
.sec-header p { color: var(--text-dim); margin-top: .75rem; max-width: 520px; margin-left: auto; margin-right: auto; }

/* ===== Services ===== */
.svc-filters { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-bottom: 2.5rem; }

.svc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }

.svc-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
}

.svc-card:hover { border-color: rgba(212,162,89,.35); transform: translateY(-4px); }

.svc-thumb {
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: rgba(212,162,89,.08);
}

.svc-thumb-fallback {
  width: 100%;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  background: rgba(212,162,89,.06);
}

.svc-body { padding: 1.25rem; }

.svc-tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: .75rem; }

.svc-tag {
  font-size: .72rem;
  font-weight: 700;
  padding: .2rem .7rem;
  border-radius: 99px;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.tag-open { background: rgba(59,130,246,.15); color: #60a5fa; }
.tag-always { background: rgba(34,197,94,.15); color: #4ade80; }
.tag-cat { background: rgba(212,162,89,.12); color: var(--accent); }

.svc-body h3 { margin-bottom: .4rem; }

.svc-desc {
  font-size: .88rem;
  color: var(--text-dim);
  margin-bottom: .75rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.svc-meta { display: flex; align-items: center; justify-content: space-between; }
.svc-price { font-size: 1.05rem; font-weight: 800; color: var(--accent); }
.svc-duration { font-size: .8rem; color: var(--text-dim); }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,.75);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  animation: fadeIn .2s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp .25s ease;
}

@keyframes slideUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

.modal-img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.modal-img-fallback {
  width: 100%;
  height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4rem;
  background: rgba(212,162,89,.07);
}

.modal-body { padding: 1.75rem; }
.modal-tags { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.modal-body h3 { font-size: 1.4rem; margin-bottom: .75rem; }
.modal-detail { color: var(--text-dim); font-size: .93rem; line-height: 1.8; margin-bottom: 1.25rem; white-space: pre-line; }
.modal-price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.modal-price { font-size: 1.4rem; font-weight: 900; color: var(--accent); }
.modal-close {
  position: absolute;
  top: 1rem; right: 1rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: rgba(255,255,255,.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: var(--transition);
}
.modal-close:hover { background: rgba(255,255,255,.14); color: var(--text); }
.modal-wrap { position: relative; }

/* ===== Process ===== */
.process-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2rem;
  position: relative;
}

.process-connector {
  position: absolute;
  top: 2.5rem;
  left: calc(12.5% + 1rem);
  right: calc(12.5% + 1rem);
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,162,89,.3), rgba(212,162,89,.3), transparent);
  z-index: 0;
}

.process-step {
  text-align: center;
  position: relative;
  z-index: 1;
}

.process-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(212,162,89,.1);
  border: 1.5px solid rgba(212,162,89,.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.6rem;
  margin: 0 auto 1.25rem;
}

.process-num {
  font-size: .7rem;
  font-weight: 800;
  letter-spacing: .12em;
  color: var(--accent);
  margin-bottom: .35rem;
  text-transform: uppercase;
}

.process-step h3 { margin-bottom: .4rem; font-size: 1rem; }
.process-step p { font-size: .85rem; color: var(--text-dim); }

/* ===== Reviews ===== */
.review-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3rem;
  padding: 1.75rem 2rem;
  background: rgba(212,162,89,.07);
  border: 1px solid rgba(212,162,89,.18);
  border-radius: var(--radius);
  margin-bottom: 3rem;
  flex-wrap: wrap;
}

.review-banner-stat strong {
  display: block;
  font-size: 1.6rem;
  font-weight: 900;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1.2;
}

.review-banner-stat span { font-size: .8rem; color: var(--text-dim); }

.reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }

.rev-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: var(--radius);
  padding: 1.4rem;
  cursor: pointer;
  transition: var(--transition);
}

.rev-card:hover { border-color: rgba(212,162,89,.3); transform: translateY(-3px); }

.rev-stars { color: var(--accent); font-size: 1rem; margin-bottom: .7rem; }

.rev-text {
  font-size: .88rem;
  color: var(--text-dim);
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 1rem;
}

.rev-footer { display: flex; align-items: center; justify-content: space-between; }

.rev-author { display: flex; align-items: center; gap: .6rem; }

.rev-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: .85rem;
  color: #0b0a0f;
  flex-shrink: 0;
}

.rev-name { font-size: .85rem; font-weight: 600; }
.rev-date { font-size: .75rem; color: var(--text-dim); }
.rev-svc-tag { font-size: .72rem; padding: .15rem .6rem; border-radius: 99px; background: rgba(212,162,89,.1); color: var(--accent); }

/* ===== Review Carousel Modal ===== */
.carousel-modal {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--radius);
  width: 100%;
  max-width: 520px;
  padding: 2rem;
  position: relative;
  animation: slideUp .25s ease;
}

.carousel-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 1.5rem;
}

.carousel-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: var(--transition);
  cursor: pointer;
}

.carousel-btn:not(:disabled):hover { background: rgba(212,162,89,.2); color: var(--accent); }
.carousel-btn:disabled { opacity: .3; cursor: not-allowed; }
.carousel-idx { font-size: .85rem; color: var(--text-dim); }

/* ===== FAQ ===== */
.faq-list { max-width: 720px; margin: 0 auto; }

.faq-item {
  border-bottom: 1px solid rgba(255,255,255,.07);
  overflow: hidden;
}

.faq-q {
  width: 100%;
  text-align: left;
  padding: 1.25rem 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-size: .95rem;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  background: none;
  border: none;
  transition: color var(--transition);
}

.faq-q:hover { color: var(--accent); }

.faq-arrow {
  flex-shrink: 0;
  font-size: .8rem;
  color: var(--text-dim);
  transition: transform var(--transition);
}

.faq-arrow.open { transform: rotate(180deg); }

.faq-a {
  max-height: 0;
  overflow: hidden;
  transition: max-height .35s ease, padding .35s ease;
  font-size: .9rem;
  color: var(--text-dim);
  line-height: 1.75;
}

.faq-a.open {
  max-height: 400px;
  padding-bottom: 1.25rem;
}

/* ===== Review Form ===== */
.form-wrap { max-width: 540px; margin: 0 auto; }

.form-group { margin-bottom: 1.25rem; }

.form-label {
  display: block;
  font-size: .85rem;
  font-weight: 600;
  margin-bottom: .45rem;
  color: var(--text-dim);
}

.form-input,
.form-textarea {
  width: 100%;
  background: var(--bg-card);
  border: 1.5px solid rgba(255,255,255,.09);
  border-radius: var(--radius-sm);
  padding: .75rem 1rem;
  color: var(--text);
  font-family: inherit;
  font-size: .95rem;
  transition: border-color var(--transition);
  outline: none;
}

.form-input:focus,
.form-textarea:focus { border-color: rgba(212,162,89,.5); }

.form-textarea { resize: vertical; min-height: 120px; }

/* Custom Select */
.custom-select { position: relative; }

.select-trigger {
  width: 100%;
  background: var(--bg-card);
  border: 1.5px solid rgba(255,255,255,.09);
  border-radius: var(--radius-sm);
  padding: .75rem 1rem;
  color: var(--text);
  font-family: inherit;
  font-size: .95rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: border-color var(--transition);
}

.select-trigger.open { border-color: rgba(212,162,89,.5); }

.select-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-card);
  border: 1.5px solid rgba(212,162,89,.3);
  border-radius: var(--radius-sm);
  z-index: 50;
  overflow: hidden;
}

.select-option {
  padding: .7rem 1rem;
  font-size: .9rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  transition: background var(--transition);
}

.select-option:hover { background: rgba(212,162,89,.1); }
.select-option.selected { color: var(--accent); }

/* Star Rating */
.star-group { display: flex; gap: .35rem; }

.star-btn {
  font-size: 1.5rem;
  background: none;
  border: none;
  color: rgba(212,162,89,.3);
  cursor: pointer;
  transition: transform var(--transition), color var(--transition);
  padding: 0;
}

.star-btn.active, .star-btn.hovered { color: var(--accent); }
.star-btn:hover { transform: scale(1.15); }

.form-success {
  text-align: center;
  padding: 3rem 2rem;
}

.form-success .success-icon { font-size: 3rem; margin-bottom: 1rem; }
.form-success h3 { font-size: 1.4rem; margin-bottom: .5rem; }
.form-success p { color: var(--text-dim); margin-bottom: 1.5rem; }

/* ===== CTA ===== */
.cta-section {
  padding: 80px 24px;
  max-width: var(--container);
  margin: 0 auto;
}

.cta-box {
  position: relative;
  padding: 3.5rem 2.5rem;
  border-radius: 24px;
  background: var(--bg-card);
  text-align: center;
  overflow: hidden;
}

.cta-box::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 24px;
  padding: 1.5px;
  background: var(--grad);
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  pointer-events: none;
}

.cta-glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(212,162,89,.09) 0%, transparent 70%);
  pointer-events: none;
}

.cta-box h2 { margin-bottom: .75rem; }
.cta-box p { color: var(--text-dim); margin-bottom: 2rem; }

.cta-btns {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.25rem;
}

.cta-note { font-size: .82rem; color: var(--text-dim); }

/* ===== Footer ===== */
.footer {
  border-top: 1px solid rgba(255,255,255,.06);
  padding: 2.5rem 24px;
  text-align: center;
}

.footer-brand {
  font-size: 1.05rem;
  font-weight: 800;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 1rem;
}

.footer-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: 1rem;
}

.footer-links a {
  font-size: .85rem;
  color: var(--text-dim);
  cursor: pointer;
  transition: color var(--transition);
}

.footer-links a:hover { color: var(--text); }
.footer-links a.footer-blog { color: var(--accent); font-weight: 600; }
.footer-copy { font-size: .78rem; color: var(--text-dim); }

/* ===== Blog ===== */
.blog-hero {
  padding: 120px 24px 60px;
  text-align: center;
}

.blog-hero h1 em { font-style: italic; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.blog-hero p { color: var(--text-dim); margin-top: .75rem; }

.blog-filters { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin: 0 auto 2.5rem; padding: 0 24px; max-width: var(--container); }

.blog-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1.5rem;
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 24px 80px;
}

.blog-card {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,.07);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
}

.blog-card:hover { border-color: rgba(212,162,89,.3); transform: translateY(-4px); }

.blog-card.featured { grid-column: span 2; display: flex; }
.blog-card.featured .blog-thumb { width: 50%; height: auto; flex-shrink: 0; }
.blog-card.featured .blog-thumb img { height: 100%; }
.blog-card.featured .blog-thumb-fallback { height: 280px; width: 50%; }

.blog-thumb { position: relative; }
.blog-thumb img { width: 100%; height: 220px; object-fit: cover; }
.blog-thumb-fallback { width: 100%; height: 220px; display: flex; align-items: center; justify-content: center; font-size: 3.5rem; background: rgba(212,162,89,.07); }

.blog-cat-badge {
  position: absolute;
  top: .75rem; left: .75rem;
  padding: .25rem .75rem;
  border-radius: 99px;
  font-size: .72rem;
  font-weight: 700;
  background: rgba(212,162,89,.88);
  color: #0b0a0f;
  text-transform: uppercase;
  letter-spacing: .05em;
}

.blog-body { padding: 1.25rem; flex: 1; }
.blog-body h3 { margin-bottom: .4rem; font-size: 1.05rem; }
.blog-summary { font-size: .85rem; color: var(--text-dim); margin-bottom: .75rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.blog-meta {
  display: flex;
  align-items: center;
  gap: .75rem;
  font-size: .78rem;
  color: var(--text-dim);
  flex-wrap: wrap;
}

/* ===== Article ===== */
.article-wrap {
  max-width: 760px;
  margin: 0 auto;
  padding: 100px 24px 80px;
}

.article-back {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  font-size: .88rem;
  color: var(--text-dim);
  margin-bottom: 2rem;
  cursor: pointer;
  transition: color var(--transition);
  background: none;
  border: none;
}

.article-back:hover { color: var(--accent); }

.article-hero-img { width: 100%; height: 320px; object-fit: cover; border-radius: var(--radius); margin-bottom: 2rem; }
.article-hero-fallback { width: 100%; height: 320px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 5rem; background: rgba(212,162,89,.07); margin-bottom: 2rem; }

.article-meta { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
.article-author-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--grad); display: flex; align-items: center; justify-content: center; font-weight: 800; color: #0b0a0f; font-size: .9rem; }
.article-meta-info strong { font-size: .9rem; }
.article-meta-info span { font-size: .78rem; color: var(--text-dim); }
.article-body { line-height: 1.85; color: var(--text-dim); }
.article-body h2 { color: var(--text); margin: 2rem 0 .75rem; }
.article-body h3 { color: var(--text); margin: 1.5rem 0 .5rem; }
.article-body p { margin-bottom: 1.1rem; }
.article-body ul, .article-body ol { margin: 0 0 1rem 1.5rem; }
.article-body li { margin-bottom: .4rem; }
.article-body strong { color: var(--text); font-weight: 700; }
.article-tags { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,.07); }
.article-tag { font-size: .8rem; padding: .3rem .8rem; border-radius: 99px; background: rgba(212,162,89,.1); color: var(--accent); }

/* ===== Loading / State ===== */
.state-box { text-align: center; padding: 4rem 1rem; color: var(--text-dim); }
.spinner { width: 36px; height: 36px; border: 3px solid rgba(212,162,89,.15); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 1rem; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  section { padding: 64px 16px; }
  .nav-links { display: none; }
  .hero-btns { flex-direction: column; }
  .svc-grid { grid-template-columns: 1fr; }
  .process-grid { grid-template-columns: repeat(2, 1fr); }
  .process-connector { display: none; }
  .reviews-grid { grid-template-columns: 1fr; }
  .blog-grid { grid-template-columns: 1fr; }
  .blog-card.featured { grid-column: span 1; flex-direction: column; }
  .blog-card.featured .blog-thumb,
  .blog-card.featured .blog-thumb-fallback { width: 100%; }
  .cta-btns { flex-direction: column; }
  .hero-stats { gap: 1.5rem; }
  .trust-list { gap: 1.25rem; }
}

클래스는 어디서 진행되나요?', answer: '서울 강남구 소재 Angel\\'s Share 라운지에서 진행됩니다. 정확한 주소는 예약 확정 후 안내드립니다.', category: '클래스', order: 3 },\n  { id: 'q4', question: '선물 포장 서비스가 있나요?', answer: '네, 프리미엄 기프트 박스 포장 서비스를 제공합니다. 주문 시 \"선물 포장\" 옵션을 선택하시면 됩니다. 개인 메시지 카드도 동봉 가능합니다.', category: '상품', order: 4 },\n  { id: 'q5', question: '구독 서비스는 언제든 해지 가능한가요?', answer: '네, 언제든 해지 가능합니다. 다음 결제일 7일 전까지 해지 신청을 하시면 다음 달부터 청구되지 않습니다.', category: '구독', order: 5 },\n  { id: 'q6', question: '환불 정책은 어떻게 되나요?', answer: '제품 수령 후 7일 이내에 미개봉 상태로 반품 신청 가능합니다. 단, 주류 특성상 개봉 후에는 환불이 불가합니다. 배송 중 파손 시 전액 환불 처리해드립니다.', category: '상품', order: 6 },\n];\n\n/* ============================================================\n   HOOKS\n============================================================ */\nfunction useIntersection(ref) {\n  const [visible, setVisible] = useState(false);\n  useEffect(() => {\n    if (!ref.current) return;\n    const obs = new IntersectionObserver(\n      ([entry]) => { if (entry.isIntersecting) { setVisible(true); obs.unobserve(entry.target); } },\n      { threshold: .12 }\n    );\n    obs.observe(ref.current);\n    return () => obs.disconnect();\n  }, []);\n  return visible;\n}\n\nfunction Anim({ children, delay = 0 }) {\n  const ref = useRef(null);\n  const visible = useIntersection(ref);\n  const animStyle = {transitionDelay: delay + 'ms'};\n  return (\n    <div ref={ref} className={'anim' + (visible ? ' visible' : '')} style={animStyle}>\n      {children}\n    </div>\n  );\n}\n\n/* ============================================================\n   NAV\n============================================================ */\nconst navLogoStyle = {cursor: 'pointer'};\nfunction Nav({ view, setView }) {\n  function scrollTo(id) {\n    if (view !== 'home') { setView('home'); setTimeout(() => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' }), 100); }\n    else document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });\n  }\n  const isBlog = view === 'blog' || view === 'article';\n  return (\n    <nav className=\"nav\">\n      <div className=\"nav-logo\" onClick={() => setView('home')} style={navLogoStyle}>🥃 Angel&apos;s Share</div>\n      <div className=\"nav-links\">\n        <a onClick={() => scrollTo('services')}>위스키</a>\n        <a onClick={() => scrollTo('process')}>이용 방법</a>\n        <a onClick={() => scrollTo('reviews')}>후기</a>\n        <a onClick={() => setView('blog')} className={isBlog ? 'nav-active' : ''}>위스키 스토리</a>\n        <a onClick={() => scrollTo('faq')}>FAQ</a>\n      </div>\n      <button className=\"btn btn-primary\" onClick={() => scrollTo('review-form')}>주문하기</button>\n    </nav>\n  );\n}\n\n/* ============================================================\n   HERO\n============================================================ */\nfunction Hero({ setView }) {\n  return (\n    <section className=\"hero\" id=\"home\">\n      <div className=\"hero-glow-top\" />\n      <div className=\"hero-glow-bottom\" />\n      <div className=\"hero-content\">\n        <Anim>\n          <div className=\"hero-award\">🏆 2026 위스키 어워드 수상</div>\n        </Anim>\n        <Anim delay={80}>\n          <h1>한 잔의 여유,<br /><em>세상에서 가장 깊은 한 모금.</em></h1>\n        </Anim>\n        <Anim delay={160}>\n          <p className=\"hero-sub\">위스키를 판매하는 곳이 아니라, 위스키를 이해하고 즐기는 문화를 전달하는 브랜드입니다.</p>\n        </Anim>\n        <Anim delay={240}>\n          <div className=\"hero-btns\">\n            <button className=\"btn btn-primary btn-lg\" onClick={() => document.getElementById('services')?.scrollIntoView({ behavior: 'smooth' })}>컬렉션 둘러보기</button>\n            <button className=\"btn btn-ghost btn-lg\" onClick={() => document.getElementById('reviews')?.scrollIntoView({ behavior: 'smooth' })}>고객 후기</button>\n            <button className=\"btn btn-ghost btn-lg\" onClick={() => setView('blog')}>📖 위스키 스토리</button>\n          </div>\n        </Anim>\n        <Anim delay={320}>\n          <div className=\"hero-stats\">\n            <div className=\"hero-stat\"><strong>300+</strong><span>보틀</span></div>\n            <div className=\"hero-stat\"><strong>5.0 ★</strong><span>별점</span></div>\n            <div className=\"hero-stat\"><strong>98%</strong><span>재구매율</span></div>\n          </div>\n        </Anim>\n      </div>\n      <div className=\"hero-scroll\"><span>↓</span><span>스크롤하여 더 알아보기</span></div>\n    </section>\n  );\n}\n\n/* ============================================================\n   TRUST BAR\n============================================================ */\nfunction TrustBar() {\n  const items = ['Whisky Magazine', 'JW 어워드 2026', '한국소믈리에협회', 'Forbes Korea', 'The Spirits Business'];\n  return (\n    <div className=\"trust-bar\">\n      <p className=\"trust-label\">As Featured In</p>\n      <div className=\"trust-list\">\n        {items.map(it => <span key={it} className=\"trust-item\">{it}</span>)}\n      </div>\n    </div>\n  );\n}\n\n/* ============================================================\n   SERVICES\n============================================================ */\nfunction parseSvc(page) {\n  const p = page.properties;\n  return {\n    id: page.id,\n    name: rtText(p['서비스명']?.title),\n    category: p['카테고리']?.select?.name || '',\n    price: rtText(p['가격']?.rich_text),\n    duration: rtText(p['소요시간']?.rich_text),\n    desc: rtText(p['설명']?.rich_text),\n    detail: rtText(p['상세 설명']?.rich_text),\n    status: p['상태']?.select?.name || '',\n    imgUrl: null,\n    emoji: '🥃',\n  };\n}\n\nfunction SvcCard({ item, onClick }) {\n  return (\n    <div className=\"svc-card\" onClick={() => onClick(item)}>\n      {item.imgUrl\n        ? <img className=\"svc-thumb\" src={item.imgUrl} alt={item.name} onError={e => { e.currentTarget.style.display = 'none'; }} />\n        : <div className=\"svc-thumb-fallback\">{item.emoji}</div>}\n      <div className=\"svc-body\">\n        <div className=\"svc-tags\">\n          <span className={'svc-tag tag-cat'}>{item.category}</span>\n          <span className={'svc-tag ' + (item.status === '모집중' ? 'tag-open' : 'tag-always')}>{item.status || '상시 판매'}</span>\n        </div>\n        <h3>{item.name}</h3>\n        <p className=\"svc-desc\">{item.desc}</p>\n        <div className=\"svc-meta\">\n          <span className=\"svc-price\">{item.price}</span>\n          <span className=\"svc-duration\">{item.duration}</span>\n        </div>\n      </div>\n    </div>\n  );\n}\n\nconst btnFullStyle = {width:'100%',justifyContent:'center'};\nfunction SvcModal({ item, onClose }) {\n  useEffect(() => {\n    const onKey = e => { if (e.key === 'Escape') onClose(); };\n    document.addEventListener('keydown', onKey);\n    document.body.style.overflow = 'hidden';\n    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };\n  }, []);\n  return (\n    <div className=\"modal-overlay\" onClick={onClose}>\n      <div className=\"modal-wrap\" onClick={e => e.stopPropagation()}>\n        <div className=\"modal\">\n          <button type=\"button\" className=\"modal-close\" onClick={onClose}>✕</button>\n          {item.imgUrl\n            ? <img className=\"modal-img\" src={item.imgUrl} alt={item.name} />\n            : <div className=\"modal-img-fallback\">{item.emoji}</div>}\n          <div className=\"modal-body\">\n            <div className=\"modal-tags\">\n              <span className=\"svc-tag tag-cat\">{item.category}</span>\n              <span className={'svc-tag ' + (item.status === '모집중' ? 'tag-open' : 'tag-always')}>{item.status}</span>\n            </div>\n            <h3>{item.name}</h3>\n            <p className=\"modal-detail\">{item.detail || item.desc}</p>\n            <div className=\"modal-price-row\">\n              <span className=\"modal-price\">{item.price}</span>\n              <span className=\"svc-duration\">{item.duration}</span>\n            </div>\n            <button type=\"button\" className=\"btn btn-primary\" style={btnFullStyle} onClick={onClose}>주문하기</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  );\n}\n\nfunction Services() {\n  const [items, setItems] = useState(FALLBACK_SVC);\n  const [loading, setLoading] = useState(true);\n  const [filter, setFilter] = useState('전체');\n  const [modal, setModal] = useState(null);\n  const cats = ['전체', ...Array.from(new Set(items.map(i => i.category).filter(Boolean)))];\n\n  useEffect(() => {\n    if (!SVC_DB_ID || SVC_DB_ID === 'SERVICE_SHOWCASE_DB_ID_HERE') { setLoading(false); return; }\n    fetch('/api/notion/databases/' + SVC_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 12 }),\n    })\n      .then(r => r.json())\n      .then(data => { if (data.results?.length) setItems(data.results.map(parseSvc)); })\n      .catch(() => {})\n      .finally(() => setLoading(false));\n  }, []);\n\n  const shown = filter === '전체' ? items : items.filter(i => i.category === filter);\n\n  return (\n    <section id=\"services\">\n      <Anim>\n        <div className=\"sec-header\">\n          <p className=\"section-label\">위스키 컬렉션</p>\n          <h2>프리미엄 위스키 & 서비스</h2>\n          <p>엄선된 싱글몰트부터 캐스크 오너십까지, 위스키를 경험하는 모든 방법</p>\n        </div>\n      </Anim>\n      <Anim delay={80}>\n        <div className=\"svc-filters\">\n          {cats.map(c => <button key={c} type=\"button\" className={'f-chip' + (filter === c ? ' active' : '')} onClick={() => setFilter(c)}>{c}</button>)}\n        </div>\n      </Anim>\n      {loading\n        ? <div className=\"state-box\"><div className=\"spinner\" /><p>위스키 컬렉션을 불러오는 중…</p></div>\n        : <div className=\"svc-grid\">\n            {shown.map((item, i) => <Anim key={item.id} delay={i * 60}><SvcCard item={item} onClick={setModal} /></Anim>)}\n          </div>}\n      {modal && <SvcModal item={modal} onClose={() => setModal(null)} />}\n    </section>\n  );\n}\n\n/* ============================================================\n   PROCESS\n============================================================ */\nconst STEPS = [\n  { icon: '🔍', num: '01', title: '취향 상담', desc: '선호하는 맛과 예산을 알려주세요' },\n  { icon: '🍷', num: '02', title: '위스키 추천', desc: '전문 소믈리에가 맞춤 추천' },\n  { icon: '📦', num: '03', title: '주문 & 배송', desc: '프리미엄 패키징으로 안전 배송' },\n  { icon: '🥃', num: '04', title: '즐기시기', desc: '테이스팅 가이드와 함께 우아한 한 잔' },\n];\n\nfunction Process() {\n  return (\n    <div className=\"sec-dark\" id=\"process\">\n      <div className=\"container\">\n        <Anim>\n          <div className=\"sec-header\">\n            <p className=\"section-label\">이용 방법</p>\n            <h2>4단계로 즐기는 위스키</h2>\n          </div>\n        </Anim>\n        <Anim delay={80}>\n          <div className=\"process-grid\">\n            <div className=\"process-connector\" />\n            {STEPS.map((s, i) => (\n              <div key={s.num} className=\"process-step\">\n                <div className=\"process-icon\">{s.icon}</div>\n                <p className=\"process-num\">STEP {s.num}</p>\n                <h3>{s.title}</h3>\n                <p>{s.desc}</p>\n              </div>\n            ))}\n          </div>\n        </Anim>\n      </div>\n    </div>\n  );\n}\n\n/* ============================================================\n   REVIEWS\n============================================================ */\nfunction parseRev(page) {\n  const p = page.properties;\n  const rawRating = p['별점']?.select?.name || '5';\n  const num = (rawRating.match(/⭐/g) || []).length || parseInt(rawRating) || 5;\n  return {\n    id: page.id,\n    name: rtText(p['고객명']?.title),\n    rating: num,\n    text: rtText(p['후기 내용']?.rich_text),\n    service: p['서비스 종류']?.select?.name || '',\n    date: p['작성일']?.date?.start || '',\n  };\n}\n\nfunction RevCard({ item, onClick }) {\n  return (\n    <div className=\"rev-card\" onClick={() => onClick(item)}>\n      <div className=\"rev-stars\">{stars(item.rating)}</div>\n      <p className=\"rev-text\">\"{item.text}\"</p>\n      <div className=\"rev-footer\">\n        <div className=\"rev-author\">\n          <div className=\"rev-avatar\">{(item.name || '?')[0]}</div>\n          <div>\n            <div className=\"rev-name\">{item.name}</div>\n            <div className=\"rev-date\">{fmtDate(item.date)}</div>\n          </div>\n        </div>\n        {item.service && <span className=\"rev-svc-tag\">{item.service}</span>}\n      </div>\n    </div>\n  );\n}\n\nconst revTextStyle = {marginTop: '.75rem', lineHeight: 1.8};\nconst revFooterStyle = {marginTop: '1.25rem'};\nfunction RevCarousel({ items, startIdx, onClose }) {\n  const [idx, setIdx] = useState(startIdx);\n  useEffect(() => {\n    const onKey = e => {\n      if (e.key === 'Escape') onClose();\n      if (e.key === 'ArrowLeft' && idx > 0) setIdx(i => i - 1);\n      if (e.key === 'ArrowRight' && idx < items.length - 1) setIdx(i => i + 1);\n    };\n    document.addEventListener('keydown', onKey);\n    document.body.style.overflow = 'hidden';\n    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };\n  }, [idx]);\n  const item = items[idx];\n  return (\n    <div className=\"modal-overlay\" onClick={onClose}>\n      <div className=\"carousel-modal\" onClick={e => e.stopPropagation()}>\n        <button type=\"button\" className=\"modal-close\" onClick={onClose}>✕</button>\n        <div className=\"rev-stars\">{stars(item.rating)}</div>\n        <p style={revTextStyle}>\"{item.text}\"</p>\n        <div className=\"rev-footer\" style={revFooterStyle}>\n          <div className=\"rev-author\">\n            <div className=\"rev-avatar\">{(item.name || '?')[0]}</div>\n            <div>\n              <div className=\"rev-name\">{item.name}</div>\n              <div className=\"rev-date\">{fmtDate(item.date)}</div>\n            </div>\n          </div>\n          {item.service && <span className=\"rev-svc-tag\">{item.service}</span>}\n        </div>\n        <div className=\"carousel-nav\">\n          <button type=\"button\" className=\"carousel-btn\" disabled={idx === 0} onClick={() => setIdx(i => i - 1)}>←</button>\n          <span className=\"carousel-idx\">{idx + 1} / {items.length}</span>\n          <button type=\"button\" className=\"carousel-btn\" disabled={idx === items.length - 1} onClick={() => setIdx(i => i + 1)}>→</button>\n        </div>\n      </div>\n    </div>\n  );\n}\n\nfunction Reviews() {\n  const [items, setItems] = useState(FALLBACK_REV);\n  const [loading, setLoading] = useState(true);\n  const [carousel, setCarousel] = useState(null);\n\n  const avg = (items.reduce((a, b) => a + b.rating, 0) / items.length).toFixed(1);\n\n  useEffect(() => {\n    if (!REV_DB_ID || REV_DB_ID === 'CUSTOMER_REVIEW_DB_ID_HERE') { setLoading(false); return; }\n    fetch('/api/notion/databases/' + REV_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 9, filter: { property: '공개 여부', checkbox: { equals: true } }, sorts: [{ property: '작성일', direction: 'descending' }] }),\n    })\n      .then(r => r.json())\n      .then(data => { if (data.results?.length) setItems(data.results.map(parseRev)); })\n      .catch(() => {})\n      .finally(() => setLoading(false));\n  }, []);\n\n  return (\n    <section id=\"reviews\">\n      <Anim>\n        <div className=\"sec-header\">\n          <p className=\"section-label\">고객 후기</p>\n          <h2>직접 경험한 분들의 이야기</h2>\n        </div>\n      </Anim>\n      <Anim delay={80}>\n        <div className=\"review-banner\">\n          <div className=\"review-banner-stat\"><strong>{avg} ★</strong><span>평균 별점</span></div>\n          <div className=\"review-banner-stat\"><strong>{items.length}+</strong><span>실제 후기</span></div>\n          <div className=\"review-banner-stat\"><strong>98%</strong><span>재구매율</span></div>\n        </div>\n      </Anim>\n      {loading\n        ? <div className=\"state-box\"><div className=\"spinner\" /><p>후기를 불러오는 중…</p></div>\n        : <div className=\"reviews-grid\">\n            {items.map((item, i) => <Anim key={item.id} delay={i * 50}><RevCard item={item} onClick={() => setCarousel(i)} /></Anim>)}\n          </div>}\n      {carousel !== null && <RevCarousel items={items} startIdx={carousel} onClose={() => setCarousel(null)} />}\n    </section>\n  );\n}\n\n/* ============================================================\n   FAQ\n============================================================ */\nfunction parseFaq(page) {\n  const p = page.properties;\n  return {\n    id: page.id,\n    question: rtText(p['질문']?.title),\n    answer: rtText(p['답변']?.rich_text),\n    category: p['카테고리']?.select?.name || '기타',\n    order: p['정렬순서']?.number || 99,\n  };\n}\n\nconst faqFilterStyle = {marginBottom: '2rem'};\nfunction Faq() {\n  const [items, setItems] = useState(FALLBACK_FAQ);\n  const [loading, setLoading] = useState(true);\n  const [open, setOpen] = useState(null);\n  const [filter, setFilter] = useState('전체');\n  const cats = ['전체', ...Array.from(new Set(items.map(i => i.category)))];\n\n  useEffect(() => {\n    if (!FAQ_DB_ID || FAQ_DB_ID === 'FAQ_DB_ID_HERE') { setLoading(false); return; }\n    fetch('/api/notion/databases/' + FAQ_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 50, filter: { property: '공개 여부', checkbox: { equals: true } }, sorts: [{ property: '정렬순서', direction: 'ascending' }] }),\n    })\n      .then(r => r.json())\n      .then(data => { if (data.results?.length) setItems(data.results.map(parseFaq)); })\n      .catch(() => {})\n      .finally(() => setLoading(false));\n  }, []);\n\n  const shown = filter === '전체' ? items : items.filter(i => i.category === filter);\n\n  return (\n    <div className=\"sec-dark\" id=\"faq\">\n      <div className=\"container\">\n        <Anim>\n          <div className=\"sec-header\">\n            <p className=\"section-label\">FAQ</p>\n            <h2>자주 묻는 질문</h2>\n          </div>\n        </Anim>\n        <Anim delay={60}>\n          <div className=\"svc-filters\" style={faqFilterStyle}>\n            {cats.map(c => <button key={c} type=\"button\" className={'f-chip' + (filter === c ? ' active' : '')} onClick={() => setFilter(c)}>{c}</button>)}\n          </div>\n        </Anim>\n        {loading\n          ? <div className=\"state-box\"><div className=\"spinner\" /></div>\n          : <div className=\"faq-list\">\n              {shown.map(item => (\n                <Anim key={item.id}>\n                  <div className=\"faq-item\">\n                    <button type=\"button\" className=\"faq-q\" onClick={() => setOpen(open === item.id ? null : item.id)}>\n                      <span>{item.question}</span>\n                      <span className={'faq-arrow' + (open === item.id ? ' open' : '')}>▾</span>\n                    </button>\n                    <div className={'faq-a' + (open === item.id ? ' open' : '')}>{item.answer}</div>\n                  </div>\n                </Anim>\n              ))}\n            </div>}\n      </div>\n    </div>\n  );\n}\n\n/* ============================================================\n   REVIEW FORM\n============================================================ */\nconst SVC_OPTIONS = ['싱글몰트', '테이스팅', '클래스', '캐스크', '구독'];\n\nfunction CustomSelect({ value, onChange }) {\n  const [isOpen, setIsOpen] = useState(false);\n  const ref = useRef(null);\n  useEffect(() => {\n    const handler = e => { if (ref.current && !ref.current.contains(e.target)) setIsOpen(false); };\n    document.addEventListener('mousedown', handler);\n    return () => document.removeEventListener('mousedown', handler);\n  }, []);\n  return (\n    <div className=\"custom-select\" ref={ref}>\n      <button type=\"button\" className={'select-trigger' + (isOpen ? ' open' : '')} onClick={() => setIsOpen(o => !o)}>\n        <span>{value || '서비스 종류 선택'}</span>\n        <span>▾</span>\n      </button>\n      {isOpen && (\n        <div className=\"select-dropdown\">\n          {SVC_OPTIONS.map(opt => (\n            <div key={opt} className={'select-option' + (value === opt ? ' selected' : '')} onClick={() => { onChange(opt); setIsOpen(false); }}>\n              <span>{opt}</span>\n              {value === opt && <span>✓</span>}\n            </div>\n          ))}\n        </div>\n      )}\n    </div>\n  );\n}\n\nfunction StarPicker({ value, onChange }) {\n  const [hovered, setHovered] = useState(0);\n  return (\n    <div className=\"star-group\">\n      {[1,2,3,4,5].map(n => (\n        <button\n          key={n} type=\"button\"\n          className={'star-btn' + (n <= (hovered || value) ? ' active' : '') + (n <= hovered ? ' hovered' : '')}\n          onMouseEnter={() => setHovered(n)}\n          onMouseLeave={() => setHovered(0)}\n          onClick={() => onChange(n)}\n        >★</button>\n      ))}\n    </div>\n  );\n}\n\nfunction ReviewForm() {\n  const [form, setForm] = useState({ name: '', service: '', rating: 0, text: '' });\n  const [submitting, setSubmitting] = useState(false);\n  const [done, setDone] = useState(false);\n\n  async function handleSubmit(e) {\n    e.preventDefault();\n    setSubmitting(true);\n    try {\n      if (REV_DB_ID && REV_DB_ID !== 'CUSTOMER_REVIEW_DB_ID_HERE') {\n        const ratingStr = '⭐'.repeat(form.rating);\n        await fetch('/api/notion/pages', {\n          method: 'POST',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({\n            parent: { database_id: REV_DB_ID },\n            properties: {\n              '고객명': { title: [{ text: { content: form.name } }] },\n              '별점': { select: { name: ratingStr } },\n              '후기 내용': { rich_text: [{ text: { content: form.text } }] },\n              '서비스 종류': { select: { name: form.service } },\n              '작성일': { date: { start: new Date().toISOString().split('T')[0] } },\n              '공개 여부': { checkbox: false },\n            },\n          }),\n        });\n      }\n    } catch (_) {}\n    finally { setSubmitting(false); setDone(true); }\n  }\n\n  if (done) return (\n    <section id=\"review-form\">\n      <div className=\"form-success\">\n        <div className=\"success-icon\">🎉</div>\n        <h3>후기 등록 완료!</h3>\n        <p>소중한 후기 감사합니다. 검토 후 게시됩니다.</p>\n        <button type=\"button\" className=\"btn btn-primary\" onClick={() => { setDone(false); setForm({ name: '', service: '', rating: 0, text: '' }); }}>새 후기 작성하기</button>\n      </div>\n    </section>\n  );\n\n  return (\n    <section id=\"review-form\">\n      <Anim>\n        <div className=\"sec-header\">\n          <p className=\"section-label\">후기 작성</p>\n          <h2>경험을 공유해주세요</h2>\n          <p>여러분의 진솔한 후기가 더 많은 분들에게 도움이 됩니다</p>\n        </div>\n      </Anim>\n      <Anim delay={80}>\n        <form className=\"form-wrap\" onSubmit={handleSubmit}>\n          <div className=\"form-group\">\n            <label className=\"form-label\">이름</label>\n            <input className=\"form-input\" placeholder=\"홍길동\" value={form.name} onChange={e => setForm(f => ({...f, name: e.target.value}))} required />\n          </div>\n          <div className=\"form-group\">\n            <label className=\"form-label\">서비스 종류</label>\n            <CustomSelect value={form.service} onChange={v => setForm(f => ({...f, service: v}))} />\n          </div>\n          <div className=\"form-group\">\n            <label className=\"form-label\">별점</label>\n            <StarPicker value={form.rating} onChange={v => setForm(f => ({...f, rating: v}))} />\n          </div>\n          <div className=\"form-group\">\n            <label className=\"form-label\">후기 내용</label>\n            <textarea className=\"form-textarea\" placeholder=\"위스키 경험을 공유해주세요...\" value={form.text} onChange={e => setForm(f => ({...f, text: e.target.value}))} required />\n          </div>\n          <button type=\"submit\" className=\"btn btn-primary\" style={btnFullStyle} disabled={submitting}>\n            {submitting ? '등록 중…' : '후기 등록하기'}\n          </button>\n        </form>\n      </Anim>\n    </section>\n  );\n}\n\n/* ============================================================\n   CTA\n============================================================ */\nfunction Cta() {\n  return (\n    <div className=\"cta-section\" id=\"cta\">\n      <Anim>\n        <div className=\"cta-box\">\n          <div className=\"cta-glow\" />\n          <p className=\"section-label\">지금 시작하기</p>\n          <h2>위스키의 새로운 세계로</h2>\n          <p>프리미엄 위스키 문화를 경험해보세요</p>\n          <div className=\"cta-btns\">\n            <button type=\"button\" className=\"btn btn-primary btn-lg\" onClick={() => document.getElementById('services')?.scrollIntoView({ behavior: 'smooth' })}>컬렉션 둘러보기</button>\n            <button type=\"button\" className=\"btn btn-ghost btn-lg\" onClick={() => document.getElementById('review-form')?.scrollIntoView({ behavior: 'smooth' })}>후기 작성하기</button>\n          </div>\n          <p className=\"cta-note\">🎁 첫 주문 시 무료 테이스팅 노트 제공</p>\n        </div>\n      </Anim>\n    </div>\n  );\n}\n\n/* ============================================================\n   FOOTER\n============================================================ */\nfunction Footer({ setView }) {\n  return (\n    <footer className=\"footer\">\n      <div className=\"footer-brand\">🥃 Angel&apos;s Share</div>\n      <div className=\"footer-links\">\n        <a className=\"footer-blog\" onClick={() => setView('blog')}>📖 위스키 스토리</a>\n        <a>이용약관</a>\n        <a>개인정보처리방침</a>\n        <a>문의하기</a>\n      </div>\n      <p className=\"footer-copy\">© 2026 Angel&apos;s Share. All rights reserved.</p>\n    </footer>\n  );\n}\n\n/* ============================================================\n   BLOG\n============================================================ */\nfunction parseStory(page) {\n  const p = page.properties;\n  return {\n    id: page.id,\n    title: rtText(p['제목']?.title),\n    category: p['카테고리']?.select?.name || '',\n    summary: rtText(p['요약']?.rich_text),\n    body: rtText(p['본문']?.rich_text),\n    emoji: rtText(p['썸네일이모지']?.rich_text) || '🥃',\n    imgUrl: p['대표이미지URL']?.url || null,\n    author: rtText(p['저자']?.rich_text) || 'Angel\\'s Share',\n    date: p['발행일']?.date?.start || '',\n    readTime: p['읽는시간']?.number || 5,\n    views: p['조회수']?.number || 0,\n    featured: p['추천']?.checkbox || false,\n    tags: (p['태그']?.multi_select || []).map(t => t.name),\n    status: p['상태']?.status?.name || '발행',\n  };\n}\n\nfunction Blog({ setView, setArticle }) {\n  const [items, setItems] = useState(FALLBACK_STORIES);\n  const [loading, setLoading] = useState(true);\n  const [filter, setFilter] = useState('전체');\n  const cats = ['전체', ...Array.from(new Set(items.map(i => i.category).filter(Boolean)))];\n\n  useEffect(() => {\n    if (!STORY_DB_ID || STORY_DB_ID === 'WHISKY_STORY_DB_ID_HERE') { setLoading(false); return; }\n    fetch('/api/notion/databases/' + STORY_DB_ID + '/query', {\n      method: 'POST',\n      headers: { 'Content-Type': 'application/json' },\n      body: JSON.stringify({ page_size: 20, filter: { property: '상태', status: { equals: '발행' } }, sorts: [{ property: '발행일', direction: 'descending' }] }),\n    })\n      .then(r => r.json())\n      .then(data => { if (data.results?.length) setItems(data.results.map(parseStory)); })\n      .catch(() => {})\n      .finally(() => setLoading(false));\n  }, []);\n\n  const shown = filter === '전체' ? items : items.filter(i => i.category === filter);\n\n  function openArticle(story) { setArticle(story); setView('article'); window.scrollTo(0, 0); }\n\n  return (\n    <div>\n      <div className=\"blog-hero\">\n        <Anim><h1>위스키 <em>스토리</em></h1></Anim>\n        <Anim delay={80}><p>위스키를 더 깊이 이해하는 이야기들</p></Anim>\n      </div>\n      <div className=\"blog-filters\">\n        {cats.map(c => <button key={c} type=\"button\" className={'f-chip' + (filter === c ? ' active' : '')} onClick={() => setFilter(c)}>{c}</button>)}\n      </div>\n      {loading\n        ? <div className=\"state-box\"><div className=\"spinner\" /></div>\n        : <div className=\"blog-grid\">\n            {shown.map((story, i) => (\n              <Anim key={story.id} delay={i * 60}>\n                <div className={'blog-card' + (story.featured && i === 0 ? ' featured' : '')} onClick={() => openArticle(story)}>\n                  <div className=\"blog-thumb\">\n                    {story.imgUrl\n                      ? <img src={story.imgUrl} alt={story.title} onError={e => e.currentTarget.style.display='none'} />\n                      : <div className=\"blog-thumb-fallback\">{story.emoji}</div>}\n                    {story.category && <span className=\"blog-cat-badge\">{story.category}</span>}\n                  </div>\n                  <div className=\"blog-body\">\n                    <h3>{story.title}</h3>\n                    <p className=\"blog-summary\">{story.summary}</p>\n                    <div className=\"blog-meta\">\n                      <span>✍️ {story.author}</span>\n                      <span>📅 {fmtDate(story.date)}</span>\n                      <span>⏱ {story.readTime}분</span>\n                      {story.views > 0 && <span>👁 {story.views.toLocaleString()}</span>}\n                    </div>\n                  </div>\n                </div>\n              </Anim>\n            ))}\n          </div>}\n    </div>\n  );\n}\n\n/* ============================================================\n   ARTICLE\n============================================================ */\nfunction Article({ story, setView }) {\n  if (!story) return null;\n  const h1Style = {marginBottom: '1.25rem'};\n  const articleHtml = {__html: mdToHtml(story.body)};\n  return (\n    <div className=\"article-wrap\">\n      <button type=\"button\" className=\"article-back\" onClick={() => setView('blog')}>← 스토리 목록</button>\n      {story.imgUrl\n        ? <img className=\"article-hero-img\" src={story.imgUrl} alt={story.title} onError={e => e.currentTarget.style.display='none'} />\n        : <div className=\"article-hero-fallback\">{story.emoji}</div>}\n      <h1 style={h1Style}>{story.title}</h1>\n      <div className=\"article-meta\">\n        <div className=\"article-author-avatar\">{(story.author || 'A')[0]}</div>\n        <div className=\"article-meta-info\">\n          <strong>{story.author}</strong>\n          <div><span>{fmtDate(story.date)} · {story.readTime}분 읽기 {story.views > 0 ? '· 👁 ' + story.views.toLocaleString() : ''}</span></div>\n        </div>\n      </div>\n      <div className=\"article-body\" dangerouslySetInnerHTML={articleHtml} />\n      {story.tags?.length > 0 && (\n        <div className=\"article-tags\">\n          {story.tags.map(t => <span key={t} className=\"article-tag\">#{t}</span>)}\n        </div>\n      )}\n    </div>\n  );\n}\n\n/* ============================================================\n   APP\n============================================================ */\nfunction App() {\n  const [view, setView] = useState('home');\n  const [article, setArticle] = useState(null);\n\n  return (\n    <div>\n      <link href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700;800;900&display=swap\" rel=\"stylesheet\" />\n      <Nav view={view} setView={v => { setView(v); if (v === 'home') window.scrollTo(0, 0); }} />\n      {view === 'home' && (\n        <main>\n          <Hero setView={setView} />\n          <TrustBar />\n          <Services />\n          <Process />\n          <Reviews />\n          <Faq />\n          <ReviewForm />\n          <Cta />\n          <Footer setView={setView} />\n        </main>\n      )}\n      {view === 'blog' && <Blog setView={setView} setArticle={setArticle} />}\n      {view === 'article' && <Article story={article} setView={setView} />}\n      {(view === 'blog' || view === 'article') && <Footer setView={setView} />}\n    </div>\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(<App />);";
